[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dust-forecast"
version = "0.1.0"
description = "GSM GPVを用いた粉じん飛散リスク テスト計算(参考コード・可変メッシュ対応)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "xarray",
    "netCDF4",
    "matplotlib",
    "pyproj",
    "streamlit",
    "pydantic>=2",
    "pydantic-settings",
    "PyYAML",
    "Pillow",
    "cfgrib",
    "eccodes",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
